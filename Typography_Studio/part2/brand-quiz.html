<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Speed Challenge - Typography Studio</title>
    <link rel="stylesheet" href="../design-tokens.css">
    <link rel="stylesheet" href="../unified-components.css">
    <style>
        .brand-arena {
            max-width: 900px;
            margin: 40px auto;
        }
        
        .brand-display {
            background: var(--white);
            border: 3px solid var(--light-gray);
            padding: 80px;
            margin: 30px 0;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .brand-logo {
            font-size: 6em;
            font-weight: 700;
            margin-bottom: 40px;
            transition: all 0.3s;
        }
        
        .question-prompt {
            font-size: 1.5em;
            color: var(--mid-gray);
            margin-bottom: 40px;
            text-align: center;
        }
        
        .answer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }
        
        .answer-btn {
            padding: 25px;
            background: var(--white);
            border: 3px solid var(--light-gray);
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .answer-btn:hover {
            background: var(--black);
            color: var(--white);
            transform: scale(1.05);
        }
        
        .answer-btn.correct {
            background: #4caf50;
            color: var(--white);
            border-color: #4caf50;
            animation: correct-pulse 0.5s;
        }
        
        .answer-btn.wrong {
            background: #f44336;
            color: var(--white);
            border-color: #f44336;
            animation: shake 0.5s;
        }
        
        @keyframes correct-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 30px rgba(76, 175, 80, 0.6); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .round-indicator {
            text-align: center;
            font-size: 1.3em;
            color: var(--accent);
            margin: 20px 0;
            font-weight: 300;
        }
        
        .timer-circle {
            width: 120px;
            height: 120px;
            border: 8px solid var(--light-gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: 300;
            color: var(--accent);
            margin: 20px auto;
            position: relative;
        }
        
        .timer-circle.warning {
            border-color: #f44336;
            color: #f44336;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .game-stats {
            display: flex;
            justify-content: space-around;
            padding: 30px;
            background: var(--white);
            border: 2px solid var(--light-gray);
            margin: 20px 0;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .combo-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5em;
            font-weight: 700;
            color: var(--accent);
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
        }
        
        .combo-indicator.show {
            animation: combo-pop 1s;
        }
        
        @keyframes combo-pop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(-10deg); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.3) rotate(5deg); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }
        
        .brand-logo {
            font-size: 6em;
            font-weight: 700;
            margin-bottom: 40px;
            transition: all 0.3s;
            animation: brand-entrance 0.5s;
        }
        
        @keyframes brand-entrance {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-content">
            <a href="#/" class="logo">Typography Studio</a>
            <ul class="nav-links">
                <li><a href="../index.html#fundamentals">Fundamentals</a></li>
                <li><a href="../index.html#tools">Design Tools</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-wrapper">
        <div class="game-container">
            <a href="#/brand" class="back-btn">← Back to Brand Analysis</a>
            
            <div style="padding: 80px 0 60px; border-bottom: 1px solid var(--light-gray);">
                <h1 style="font-size: 4em; color: var(--black); margin-bottom: 20px; font-weight: 300;">Brand Speed Challenge</h1>
                <p style="font-size: 1.2em; color: var(--mid-gray);">Identify brand typography categories as fast as you can!</p>
            </div>

            <div class="brand-arena">
                <div class="round-indicator">Round <span id="round">1</span> of 8</div>
                
                <div class="timer-circle" id="timer-circle">10</div>
                
                <div class="game-stats">
                    <div class="stat">
                        <div class="stat-value" id="score">0</div>
                        <div class="stat-label">Score</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="combo">0x</div>
                        <div class="stat-label">Combo</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="correct">0/8</div>
                        <div class="stat-label">Correct</div>
                    </div>
                </div>
                
                <div class="brand-display">
                    <div class="brand-logo" id="brand-logo"></div>
                    <div class="question-prompt" id="question"></div>
                    <div class="answer-grid" id="answers"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="combo-indicator" id="combo-indicator"></div>

    <div class="game-over" id="game-over" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 2000;">
        <div style="background: var(--white); padding: 80px; text-align: center; max-width: 600px;">
            <h2 id="game-result" style="font-size: 3em; margin-bottom: 20px; font-weight: 300;"></h2>
            <div style="font-size: 5em; color: var(--accent); font-weight: 300; margin: 30px 0;" id="final-score"></div>
            <p style="font-size: 1.2em; color: var(--mid-gray); margin-bottom: 30px;" id="result-message"></p>
            <button class="btn" onclick="location.reload()">Play Again</button>
            <a href="#/brand" class="btn" style="background: var(--white); color: var(--black); text-decoration: none; display: inline-block; margin-left: 10px;">Back to Learning</a>
        </div>
    </div>

    <script>
        const brands = [
            { name: 'Apple', style: 'font-family: Arial, sans-serif;', answer: 'Sans-serif', options: ['Serif', 'Sans-serif', 'Script', 'Monospace'] },
            { name: 'Coca-Cola', style: 'font-family: "Brush Script MT", cursive; color: #f40009;', answer: 'Script', options: ['Serif', 'Sans-serif', 'Script', 'Display'] },
            { name: 'Google', style: 'font-family: Arial, sans-serif;', answer: 'Sans-serif', options: ['Serif', 'Sans-serif', 'Script', 'Monospace'] },
            { name: 'NIKE', style: 'font-family: "Arial Black", sans-serif; font-weight: 900;', answer: 'Sans-serif', options: ['Serif', 'Sans-serif', 'Display', 'Script'] },
            { name: 'Disney', style: 'font-family: "Brush Script MT", cursive; color: #113CCF;', answer: 'Script', options: ['Serif', 'Sans-serif', 'Script', 'Display'] },
            { name: 'IBM', style: 'font-family: "Courier New", monospace; font-weight: bold; color: #006699;', answer: 'Monospace', options: ['Serif', 'Sans-serif', 'Script', 'Monospace'] },
            { name: 'Vogue', style: 'font-family: Georgia, serif; font-style: italic;', answer: 'Serif', options: ['Serif', 'Sans-serif', 'Script', 'Display'] },
            { name: 'FedEx', style: 'font-family: Arial, sans-serif; font-weight: 700;', answer: 'Sans-serif', options: ['Serif', 'Sans-serif', 'Display', 'Monospace'] }
        ];

        let currentRound = 0;
        let score = 0;
        let combo = 0;
        let correct = 0;
        let timeLeft = 10;
        let timerInterval;

        function loadBrand() {
            if (currentRound >= brands.length) {
                endGame();
                return;
            }
            
            const brand = brands[currentRound];
            timeLeft = 10;
            
            document.getElementById('round').textContent = currentRound + 1;
            const logoEl = document.getElementById('brand-logo');
            logoEl.style.cssText = brand.style;
            logoEl.textContent = brand.name;
            logoEl.style.animation = 'brand-entrance 0.5s';
            
            document.getElementById('question').textContent = 'What typeface category?';
            document.getElementById('answers').innerHTML = brand.options.map(opt => 
                `<button class="answer-btn" onclick="selectAnswer('${opt}')">${opt}</button>`
            ).join('');
            
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            const timerEl = document.getElementById('timer-circle');
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                
                if (timeLeft <= 3) {
                    timerEl.classList.add('warning');
                } else {
                    timerEl.classList.remove('warning');
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    selectAnswer(null);
                }
            }, 1000);
        }

        function selectAnswer(answer) {
            clearInterval(timerInterval);
            const brand = brands[currentRound];
            const buttons = document.querySelectorAll('.answer-btn');
            
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === brand.answer) {
                    btn.classList.add('correct');
                }
                if (btn.textContent === answer && answer !== brand.answer) {
                    btn.classList.add('wrong');
                }
            });
            
            if (answer === brand.answer) {
                const timeBonus = timeLeft * 50;
                combo++;
                score += 100 + timeBonus + (combo * 30);
                correct++;
                
                if (combo >= 3) {
                    showCombo();
                }
                
                document.getElementById('score').textContent = score;
                document.getElementById('combo').textContent = combo + 'x';
                document.getElementById('correct').textContent = `${correct}/8`;
            } else {
                combo = 0;
                document.getElementById('combo').textContent = '0x';
            }
            
            setTimeout(() => {
                currentRound++;
                loadBrand();
            }, 1500);
        }

        function showCombo() {
            const comboEl = document.getElementById('combo-indicator');
            const messages = ['COMBO!', 'ON FIRE! 🔥', 'UNSTOPPABLE! ⚡', 'LEGENDARY! 🌟'];
            const message = combo >= 6 ? messages[3] : combo >= 4 ? messages[2] : combo >= 3 ? messages[1] : messages[0];
            comboEl.textContent = combo + 'x ' + message;
            comboEl.classList.add('show');
            setTimeout(() => comboEl.classList.remove('show'), 1000);
        }

        function endGame() {
            const perfectScore = correct === 8;
            const highCombo = combo >= 5;
            
            document.getElementById('final-score').textContent = score;
            
            if (perfectScore && highCombo) {
                document.getElementById('game-result').textContent = '🏆 LEGENDARY!';
                document.getElementById('result-message').textContent = `Perfect score with amazing combo! You're a typography master!`;
            } else if (perfectScore) {
                document.getElementById('game-result').textContent = '🎉 Perfect!';
                document.getElementById('result-message').textContent = `You identified all 8 brands correctly!`;
            } else if (correct >= 6) {
                document.getElementById('game-result').textContent = '🌟 Great Job!';
                document.getElementById('result-message').textContent = `You identified ${correct} out of 8 brands correctly!`;
            } else {
                document.getElementById('game-result').textContent = '🏁 Complete!';
                document.getElementById('result-message').textContent = `You identified ${correct} out of 8 brands. Keep practicing!`;
            }
            
            document.getElementById('game-over').style.display = 'flex';
        }

        loadBrand();
    </script>
</body>
</html>
